# PostgreSQL for local development: docker compose -f compose.dev.yml up -d postgres
# Then: ./mvnw spring-boot:run, and npm run dev in web/.
# A project name of its own, so that it never touches the containers of docker-compose.yml.
name: lore-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: lore
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
    ports:
      - "5433:5432"
    volumes:
      - dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev-db:
