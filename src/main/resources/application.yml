# Lore is configured with LORE_* environment variables:
# see the "Environment variables" page of the documentation.

lore:
  db:
    host: postgres
    port: 5432
    name: lore
    user: lore
    password: ""
  session-timeout: 8h
  log-level: INFO
  files-path: /var/lib/lore/files
  max-upload-size: 1GB

spring:
  application:
    name: lore
  datasource:
    url: jdbc:postgresql://${lore.db.host}:${lore.db.port}/${lore.db.name}
    username: ${lore.db.user}
    password: ${lore.db.password}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration
    # A file named V4_identity.sql (one underscore) would otherwise be skipped without a word.
    validate-migration-naming: true
  session:
    timeout: ${lore.session-timeout}
    jdbc:
      initialize-schema: never
      table-name: spring_session
      cleanup-cron: "0 * * * * *"
  web:
    resources:
      # The interface is served by SpaConfiguration.
      add-mappings: false
  servlet:
    multipart:
      # Only the ceiling here: the size chosen by the administrators is checked by Lore, before
      # the file is read (resolve-lazily) when the request announces its length.
      max-file-size: ${lore.max-upload-size}
      resolve-lazily: true

server:
  # LORE_PORT, for the packages and the archive; with Docker, change the published port instead.
  port: ${LORE_PORT:8080}
  # Trusts the X-Forwarded-* headers of the reverse proxies listed in LORE_TRUSTED_PROXIES only:
  # by default, a proxy on the same machine. Ranges in CIDR notation, separated by commas, for
  # example "10.0.0.5/32, 192.168.10.0/24" (each one with its "/", read by Tomcat's NetMaskSet).
  # Empty: no proxy is trusted. A client outside these ranges cannot choose its address.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${LORE_TRUSTED_PROXIES:127.0.0.0/8, ::1/128}"
    # The header of the file in an import holds its name: up to 255 characters, several bytes each.
    max-part-header-size: 2KB
  servlet:
    session:
      timeout: ${lore.session-timeout}
  compression:
    enabled: true
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  paths-to-match: /api/**
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: ${lore.log-level}
    # These two write the address of each request, the words searched with it, at the DEBUG level.
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    # These write the bodies read and sent at the DEBUG level (passwords, link tokens, setup code),
    # and the values given to SQL statements at the TRACE level.
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: INFO
    # Tomcat writes each raw request, its cookies and its body, at the TRACE level.
    org.apache.coyote.http11: INFO
    # These write the words searched and the session cookie: the arguments of each controller call
    # and the address of each request checked (TRACE), the parameters and cookies read by Tomcat
    # (DEBUG), the values sent to PostgreSQL (TRACE). SecretsInLogsTests checks it.
    org.springframework.web.method.HandlerMethod: INFO
    org.springframework.security.web: INFO
    org.apache.tomcat.util.http: INFO
    org.postgresql: INFO
