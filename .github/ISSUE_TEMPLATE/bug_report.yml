name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem.
        **A security issue?** Do not report it here: follow [SECURITY.md](https://github.com/dada-core/lore/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Administration > Members
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lore version
      description: The image tag, or the commit if you built it from source.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version, browser.
      placeholder: "Ubuntu 24.04, Docker 27, Firefox 140"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines of `docker compose logs lore`. Remove anything private first.
      render: text
