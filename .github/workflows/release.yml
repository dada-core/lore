name: Release

# On a v* tag (for example v0.1.0, matching the version in pom.xml): the universal archive, the .deb
# and .rpm packages for amd64 and arm64, the multi-architecture image ghcr.io/dada-core/lore tagged
# with the version and its major.minor, the SHA256SUMS file, and a GitHub release with every file.
# A version with a suffix (v0.1.0-alpha.1, v0.1.0-rc.1) is a preview: its image only gets its own tag,
# and its release is marked as a pre-release, so releases/latest keeps pointing to the last stable one.
# Before the release is created, the published image is timed through the five minutes on amd64 and
# arm64, with the docker-compose.yml of the release, and analysed for vulnerabilities: a failure of
# either stops the publication.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Application and archive
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - id: version
        name: The tag matches the version in pom.xml
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but pom.xml says $version."
            exit 1
          fi
          case $version in
            *SNAPSHOT*) echo "::error::$version is a development version: set the version to release in pom.xml."; exit 1 ;;
          esac
          # image: the tag of the image in the published docker-compose.yml. A stable version moves the
          # major.minor tag (0.1), so that the same file receives the fixes, once its checks have passed
          # (job image-tag); a preview only has its own.
          case $version in
            *-*) prerelease=true; image=$version ;;
            *) prerelease=false; image=${version%.*} ;;
          esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
      - name: Interface, tests and application
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          ./mvnw -B verify
      - name: Universal archive
        run: sh packaging/package.sh archive
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/lore.jar
      - uses: actions/upload-artifact@v7
        with:
          name: archive
          path: build/dist/

  packages:
    name: Packages (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: target
      - name: Java runtime and packages
        run: |
          sh packaging/package.sh runtime
          sh packaging/package.sh packages ${{ matrix.arch }}
      - name: The .deb starts as a service
        run: |
          docker run -d --name db -p 5432:5432 -e POSTGRES_PASSWORD=postgres-test postgres:18-alpine
          until docker exec db pg_isready -h 127.0.0.1 >/dev/null 2>&1; do sleep 1; done
          sleep 2
          docker exec db psql -U postgres -q -c "create role lore login password 'lore-test'" -c "create database lore owner lore"
          sudo apt-get install -y ./build/dist/lore_*_${{ matrix.arch }}.deb
          sudo sed -i 's/^LORE_DB_PASSWORD=.*/LORE_DB_PASSWORD=lore-test/' /etc/lore/lore.env
          sudo systemctl enable --now lore
          for _ in $(seq 90); do curl -fsS localhost:8080/actuator/health/readiness 2>/dev/null | grep -q UP && break; sleep 2; done
          curl -fsS localhost:8080/actuator/health/readiness | grep -q '"UP"'
          sudo lore help | grep -q reset-password
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: build/dist/

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A candidate tag: the tags people pull are set once the image has passed its checks (job image-tag).
          tags: ghcr.io/dada-core/lore:${{ needs.build.outputs.version }}-candidate
          labels: |
            org.opencontainers.image.title=Lore
            org.opencontainers.image.description=Open source workspace for technical knowledge
            org.opencontainers.image.source=https://github.com/dada-core/lore
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  # The docker-compose.yml of the repository, with the image of the release instead of a local build.
  # The installation guide downloads it from releases/latest/download/docker-compose.yml.
  compose:
    name: Compose file
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compose file
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          mkdir -p dist
          sed -e '/^    build: \.$/d' \
              -e "s|^    image: lore:local$|    image: ghcr.io/dada-core/lore:$IMAGE|" \
              -e 's|^# Lore and its PostgreSQL database, built from this repository\.$|# Lore and its PostgreSQL database.|' \
              -e 's|docker compose up -d --build|docker compose up -d|' \
              -e '/^# The file published with each release is the same/d' \
              docker-compose.yml > dist/docker-compose.yml
          grep -q "^    image: ghcr.io/dada-core/lore:$IMAGE$" dist/docker-compose.yml
          if grep -q 'build' dist/docker-compose.yml; then echo "docker-compose.yml still builds locally"; exit 1; fi
          cat dist/docker-compose.yml
      - uses: actions/upload-artifact@v7
        with:
          name: compose
          path: dist/docker-compose.yml

  # The five minutes with what a person downloads: the docker-compose.yml of the release and the
  # image just published, on each architecture. The arm64 image, built by emulation, starts here.
  five-minutes:
    name: Five minutes (${{ matrix.arch }})
    needs: [build, image, compose]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: compose
          path: ${{ runner.temp }}/release
      - name: Playwright and Chromium
        run: |
          npm ci --prefix web --no-audit --no-fund
          cd web && npx playwright install --with-deps chromium
      # The file names the tag of the version, or of its major.minor (0.1), set only once these checks
      # have passed: the candidate image is the one tried, the file otherwise as published.
      - name: From docker-compose.yml to the passage found
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          compose="$RUNNER_TEMP/release/docker-compose.yml"
          sed -i "s|^    image: ghcr.io/dada-core/lore:.*$|    image: ghcr.io/dada-core/lore:$VERSION-candidate|" "$compose"
          grep -q "^    image: ghcr.io/dada-core/lore:$VERSION-candidate$" "$compose"
          sh packaging/five-minutes.sh "$compose"

  # The published image on each architecture, analysed by Trivy (its image, pinned by its digest):
  # no critical or high vulnerability that has a fix.
  scan:
    name: Image analysis
    needs: [build, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Trivy
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            docker run --rm -v trivy-cache:/root/.cache "$TRIVY" image --quiet --timeout 20m --platform "$platform" \
              --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
              "ghcr.io/dada-core/lore:$VERSION-candidate"
            echo "::endgroup::"
          done

  # The tags people pull, set only once the candidate image has passed the five minutes and the
  # analysis, and the packages have passed their checks: the one of the version, and for a stable version the one of its major.minor (0.1), which
  # the docker-compose.yml of the release names. A rejected image keeps its candidate tag alone.
  image-tag:
    name: Image tags
    needs: [build, packages, compose, five-minutes, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ghcr.io/dada-core/lore:${{ needs.build.outputs.version }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          name=ghcr.io/dada-core/lore
          tags="-t $name:$VERSION"
          if [ "$IMAGE" != "$VERSION" ]; then tags="$tags -t $name:$IMAGE"; fi
          docker buildx imagetools create $tags "$name:$VERSION-candidate"


  publish:
    name: GitHub release
    needs: [build, packages, image, compose, five-minutes, scan, image-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: archive
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: compose
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # An alpha may lose its data at the next version; a beta or a release candidate holds every
          # feature of its version, and its data carries over.
          case $VERSION in
            *-alpha*) intro="Preview of Lore $VERSION, to try it out: not for production, its data may not carry over to the next version." ;;
            *) intro="Preview of Lore $VERSION, with every feature of version ${VERSION%%-*}: its data will carry over to it." ;;
          esac
          if [ "$PRERELEASE" = true ]; then
            set -- --prerelease
          else
            set --
            intro="Lore $VERSION."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lore $VERSION" \
            --notes "$intro Installation: https://lore.dada-core.com/en/docs/installation/ (Docker image ghcr.io/dada-core/lore:$VERSION, .deb and .rpm packages, universal archive). Checksums in SHA256SUMS." \
            --verify-tag "$@"
